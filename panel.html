<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>پنل تیکت‌ها</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-grid"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo">🎮</div>
      <div>
        <div class="brand-title">امیر گیمر</div>
        <div class="brand-sub">Tickets Panel</div>
      </div>
    </div>
    <nav class="nav">
      <a class="nav-btn" href="contact.html">ارتباط</a>
      <a class="nav-btn" href="index.html">خانه</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="panel">
      <h2 class="sec-title">کنسول تیکت‌ها</h2>

      <div class="profile-grid" style="grid-template-columns: 1fr;">
        <div class="card" style="background: rgba(255,255,255,.03);">
          <div class="list" style="gap:12px;">
            <div class="list-item">
              <span>کد دسترسی (توکن)</span>
            </div>
            <input id="token" type="password" placeholder="توکن رو اینجا بزن" 
                   style="width:100%; padding:12px 12px; border-radius:16px; border:1px solid rgba(255,255,255,.12); background:rgba(0,0,0,.12); color:#e9e9ff; outline:none;">

            <button class="btn primary" id="loadBtn" style="width:100%; border-radius:16px;">
              نمایش تیکت‌ها
            </button>

            <div id="msg" style="display:none; color: rgba(233,233,255,.7);"></div>

            <div id="tickets" style="margin-top:12px; display:none;"></div>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div>© 2026 Amir Gamer</div>
      <div class="footer-right">Private Panel</div>
    </footer>
  </main>

  <script>
    const loadBtn = document.getElementById("loadBtn");
    const tokenEl = document.getElementById("token");
    const ticketsEl = document.getElementById("tickets");
    const msgEl = document.getElementById("msg");

    function esc(s){
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function loadTickets(){
      const token = tokenEl.value.trim();
      if(!token){
        msgEl.style.display = "block";
        msgEl.textContent = "توکن رو وارد کن.";
        return;
      }

      msgEl.style.display = "block";
      msgEl.textContent = "در حال دریافت...";

      const res = await fetch("/.netlify/functions/tickets/list", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token })
      });

      const data = await res.json();
      if(!res.ok){
        msgEl.textContent = "خطا: " + (data?.error || "مشکل");
        return;
      }

      const list = data.tickets || [];
      ticketsEl.style.display = "block";

      if(list.length === 0){
        ticketsEl.innerHTML = `<div style="color:rgba(233,233,255,.65);">تیکتی ثبت نشده.</div>`;
        msgEl.textContent = "";
        return;
      }

      ticketsEl.innerHTML = list.map(t => `
        <div class="card" style="margin-top:12px; border-color: rgba(34,211,238,.25);">
          <div class="card-title" style="display:flex; justify-content:space-between; gap:10px; align-items:center;">
            <span>کد: ${esc(t.ticketCode)}</span>
            <span style="font-size:12px; color:rgba(233,233,255,.6)">${esc(t.createdAt)}</span>
          </div>
          <div class="card-text" style="margin-top:8px;">
            <b>نام:</b> ${esc(t.name)}<br/>
            <b>تماس:</b> ${esc(t.contact)}<br/>
            <b>موضوع:</b> ${esc(t.subject)}<br/>
            <b>متن:</b> ${esc(t.message)}
          </div>
        </div>
      `).join("");
      msgEl.textContent = "";
    }

    loadBtn.addEventListener("click", loadTickets);
  </script>
</body>
</html>
