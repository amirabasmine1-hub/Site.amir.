<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ارتباط - امیر گیمر</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-grid"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo">🎮</div>
      <div>
        <div class="brand-title">امیر گیمر</div>
        <div class="brand-sub">Support Ticket</div>
      </div>
    </div>
    <nav class="nav">
      <a class="nav-btn" href="index.html">خانه</a>
      <a class="nav-btn" href="panel.html">پنل تیکت‌ها</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="panel">
      <h2 class="sec-title">ارسال تیکت</h2>

      <div class="profile-grid" style="grid-template-columns: 1fr;">
        <div class="card" style="background: rgba(255,255,255,.03);">
          <div class="list" style="gap:12px;">
            <div class="list-item">
              <span>نام شما</span>
            </div>
            <input id="name" type="text" placeholder="مثلاً: علی گیمر" 
                   style="width:100%; padding:12px 12px; border-radius:16px; border:1px solid rgba(255,255,255,.12); background:rgba(0,0,0,.12); color:#e9e9ff; outline:none;">

            <div class="list-item">
              <span>شماره/یوزرنیم (روبیکا/تلگرام)</span>
            </div>
            <input id="contact" type="text" placeholder="مثلاً: @user یا 09..." 
                   style="width:100%; padding:12px 12px; border-radius:16px; border:1px solid rgba(255,255,255,.12); background:rgba(0,0,0,.12); color:#e9e9ff; outline:none;">

            <div class="list-item">
              <span>موضوع</span>
            </div>
            <input id="subject" type="text" placeholder="مثلاً: مشکل در سفارش/تیکت" 
                   style="width:100%; padding:12px 12px; border-radius:16px; border:1px solid rgba(255,255,255,.12); background:rgba(0,0,0,.12); color:#e9e9ff; outline:none;">

            <div class="list-item">
              <span>متن پیام</span>
            </div>
            <textarea id="message" rows="6" placeholder="اینجا توضیح بده..." 
              style="width:100%; padding:12px 12px; border-radius:16px; border:1px solid rgba(255,255,255,.12); background:rgba(0,0,0,.12); color:#e9e9ff; outline:none; resize: vertical;"></textarea>

            <button class="btn primary" id="sendBtn" style="width:100%; border-radius:16px;">
              ارسال تیکت
            </button>

            <div id="status" style="color: rgba(233,233,255,.7); line-height: 1.8; display:none;"></div>

            <div style="margin-top:10px; font-size:12px; color: rgba(233,233,255,.55);">
              * تیکت بعد از ثبت، یک کد پیگیری می‌گیرد.
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div>© 2026 Amir Gamer</div>
      <div class="footer-right">Ticket System</div>
    </footer>
  </main>

  <script>
    const sendBtn = document.getElementById("sendBtn");
    const statusEl = document.getElementById("status");

    async function sendTicket(){
      const name = document.getElementById("name").value.trim();
      const contact = document.getElementById("contact").value.trim();
      const subject = document.getElementById("subject").value.trim();
      const message = document.getElementById("message").value.trim();

      if(!name || !contact || !subject || !message){
        statusEl.style.display = "block";
        statusEl.textContent = "لطفاً همه فیلدها رو کامل کن.";
        return;
      }

      statusEl.style.display = "block";
      statusEl.textContent = "در حال ثبت تیکت...";

      // این URL باید با Netlify URL/Function درست تنظیم بشه
      // (بعد در گام Netlify این را fix می‌کنیم)
      const res = await fetch("/.netlify/functions/tickets/create", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, contact, subject, message })
      });

      const data = await res.json();
      if(!res.ok){
        statusEl.textContent = "خطا: " + (data?.error || "مشکل در ثبت تیکت");
        return;
      }

      statusEl.textContent =
        "✅ تیکت ثبت شد! کد پیگیری: " + data.ticketCode +
        "\nمی‌تونید در پنل تیکت‌ها وضعیت رو ببینید.";
    }

    sendBtn.addEventListener("click", sendTicket);
  </script>
</body>
</html>
